<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детали</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0a0a0a; color: #e5e5e5; }
    iframe { border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col">

  <button onclick="window.close()" 
          class="mb-6 text-purple-400 hover:text-purple-500 text-lg flex items-center gap-2">
    ← Назад
  </button>

  <div id="content" class="max-w-6xl mx-auto flex-1"></div>

  <!-- Футер -->
  <footer class="mt-16 py-8 text-center text-gray-500 text-sm border-t border-gray-800">
    <p class="mb-2">
      Все материалы взяты из открытых источников. Данный проект создан исключительно в образовательных целях.<br>
      Администрация проекта не несёт ответственности за размещённый контент.
    </p>
    <p class="mt-3">
      Почта для связи: 
      <a href="mailto:corporationofgoodandevil@gmail.com" class="hover:text-purple-400">corporationofgoodandevil@gmail.com</a>
    </p>
    <div class="flex justify-center gap-6 mt-4">
      <a href="https://github.com/constantin-online/poiskanime" target="_blank" class="hover:text-purple-400">GitHub</a>
      <a href="https://vk.com/public222341639" target="_blank" class="hover:text-purple-400">Группа VK</a>
    </div>
    <p class="mt-6 text-xs text-gray-600">© 2026 • Все права принадлежат правообладателям</p>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const dataStr = params.get("data");

    if (dataStr) {
      const item = JSON.parse(decodeURIComponent(dataStr));
      const mat = item.material_data || {};

      let html = `
        <div class="max-w-6xl mx-auto">
          <div class="flex flex-col lg:flex-row gap-10">
            <!-- Постер -->
            <div class="lg:w-96 flex-shrink-0">
              <img src="${mat.poster_url || ''}" 
                   class="w-full rounded-3xl shadow-2xl" 
                   onerror="this.src='https://via.placeholder.com/400x600?text=No+Poster'">
            </div>

            <!-- Основная информация -->
            <div class="flex-1">
              <h1 class="text-4xl font-bold mb-3">${item.title || mat.title || 'Без названия'}</h1>
              <p class="text-2xl text-gray-400 mb-8">${item.year || mat.year || ''}</p>

              ${mat.description ? 
                `<p class="leading-relaxed text-gray-300 text-lg">${mat.description}</p>` : ''}

              <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">
                ${mat.genres ? `<div><strong>Жанры:</strong><br>${mat.genres.join(', ')}</div>` : ''}
                ${mat.actors ? `<div><strong>Актёры:</strong><br>${mat.actors.slice(0, 10).join(', ')}</div>` : ''}
                ${mat.directors ? `<div><strong>Режиссёры:</strong><br>${mat.directors.join(', ')}</div>` : ''}
                ${mat.kinopoisk_rating ? `<div><strong>КиноПоиск:</strong> ${mat.kinopoisk_rating}</div>` : ''}
              </div>
            </div>
          </div>

          <!-- Плеер -->
          <div class="mt-14">
            <h2 class="text-2xl font-semibold mb-5">Плеер</h2>
            <iframe src="${item.link.startsWith('//') ? 'https:' + item.link : item.link}" 
                    class="w-full aspect-video rounded-3xl" 
                    allowfullscreen></iframe>
          </div>
        </div>
      `;

      document.getElementById("content").innerHTML = html;
    }
  </script>
</body>
</html>
